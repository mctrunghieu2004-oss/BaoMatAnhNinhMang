<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureGrade - Nhap diem</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <nav><span id="who"></span><button id="logout" class="secondary">Dang xuat</button></nav>
  <h1>Lop toi day</h1>
  <label for="course">Chon lop</label>
  <select id="course"></select>
  <table>
    <tr><th>Tai khoan</th><th>Ho ten</th><th>Diem</th><th></th></tr>
    <tbody id="rows"></tbody>
  </table>
  <div id="msg"></div>

  <dialog id="editor">
    <form method="dialog">
      <h1>Sua diem</h1>
      <p id="target"></p>
      <label for="score">Diem (0 - 10)</label>
      <input id="score" type="number" min="0" max="10" step="0.01" required>
      <label for="reason">Ly do (it nhat 5 ky tu)</label>
      <input id="reason" maxlength="200" required>
      <label for="otp">Ma OTP moi (step-up)</label>
      <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
      <p><button id="save">Luu</button> <button id="cancel" class="secondary">Huy</button></p>
    </form>
  </dialog>
</main>
<script type="module" src="/js/lecturer.js"></script>
</body>
</html>
