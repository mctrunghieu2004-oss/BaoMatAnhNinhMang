<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureGrade - Xác thực hai lớp</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth">
<main class="card auth-card">
  <div class="auth-head">
    <span class="mark">SG</span>
    <div><strong>SecureGrade</strong><span>Xác thực hai lớp</span></div>
  </div>
  <h1 id="title">Xác thực hai lớp</h1>
  <div id="enroll">
    <p class="sub">Quét mã QR bằng Google Authenticator hoặc Microsoft Authenticator, rồi nhập mã 6 số.</p>
    <div class="qr-wrap"><img id="qr" alt="Mã QR TOTP"></div>
  </div>
  <form id="form">
    <label for="otp">Mã OTP</label>
    <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
    <p class="hint">Mã đổi mỗi 30 giây và chỉ dùng được một lần.</p>
    <button type="submit">Xác nhận</button>
  </form>
  <div id="msg"></div>
</main>
<script type="module" src="/js/mfa.js"></script>
</body>
</html>
