<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureGrade - Đăng nhập</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth">
<main class="card auth-card">
  <div class="auth-head">
    <span class="mark">SG</span>
    <div><strong>SecureGrade</strong><span>Hệ thống nhập điểm</span></div>
  </div>
  <h1>Đăng nhập</h1>
  <p class="sub">Sau bước mật khẩu, bạn cần nhập mã OTP trên điện thoại.</p>
  <form id="form">
    <label for="username">Tài khoản</label>
    <input id="username" name="username" autocomplete="username" maxlength="50" required>
    <label for="password">Mật khẩu</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    <button type="submit">Đăng nhập</button>
  </form>
  <div id="msg"></div>
  <p class="auth-foot">Phiên đăng nhập hết hạn sau 15 phút.</p>
</main>
<script type="module" src="/js/login.js"></script>
</body>
</html>
