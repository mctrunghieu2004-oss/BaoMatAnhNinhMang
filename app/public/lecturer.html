<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureGrade - Nhập điểm</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">SG</span>SecureGrade</div>
  <div class="user"><span id="who"></span><button id="logout" class="ghost">Đăng xuất</button></div>
</header>
<main class="page">
  <section class="card">
    <h1>Lớp tôi dạy</h1>
    <p class="sub">Mỗi lần sửa điểm cần một mã OTP mới và được ghi vào nhật ký.</p>
    <div class="row">
      <div class="field">
        <label for="course">Chọn lớp</label>
        <select id="course"></select>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <tr><th>Tài khoản</th><th>Họ tên</th><th class="right">Điểm</th><th></th></tr>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="msg"></div>
  </section>

  <dialog id="editor">
    <form method="dialog">
      <h1>Sửa điểm</h1>
      <p id="target" class="target"></p>
      <label for="score">Điểm (0 – 10)</label>
      <input id="score" type="number" min="0" max="10" step="0.01" required>
      <label for="reason">Lý do (ít nhất 5 ký tự)</label>
      <input id="reason" maxlength="200" required>
      <label for="otp">Mã OTP mới (step-up)</label>
      <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
      <p class="hint">Không dùng lại mã vừa dùng để đăng nhập.</p>
      <div class="actions">
        <button id="cancel" type="button" class="secondary">Huỷ</button>
        <button id="save">Lưu</button>
      </div>
    </form>
  </dialog>
</main>
<script type="module" src="/js/lecturer.js"></script>
</body>
</html>
